services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportis_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_URL=http://localhost:8080
      - MYSQL_SERVER=db
      - MYSQL_USER=sportis_user
      - MYSQL_PASSWORD=sportis_pass
      - MYSQL_DB=sportis
      - MYSQL_PORT=3306
      - MAIL_ADDRESS=
      - MAIL_PASSWORD=
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  db:
    image: mariadb:10.11
    container_name: sportis_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sportis
      MYSQL_USER: sportis_user
      MYSQL_PASSWORD: sportis_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
